name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          shared-key: archive-release

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_TOKEN: ${{ secrets.VITE_UPDATER_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ArcHive ${{ github.ref_name }}'
          releaseBody: 'Voir les commits pour les changements.'
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true

      - name: Publish to ArcHive-updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"

          # Télécharger les artefacts depuis la release privée
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          gh release download $tag --repo apoumier/ArcHive --pattern "*.msi" --pattern "*.msi.sig" --pattern "*.exe" --pattern "*.exe.sig" --pattern "latest.json" --dir artifacts

          # Créer ou mettre à jour la release publique dans ArcHive-updates
          $releaseExists = gh release view $tag --repo apoumier/ArcHive-updates 2>$null
          if (-not $releaseExists) {
            gh release create $tag --repo apoumier/ArcHive-updates --title "ArcHive $tag" --notes "Voir les commits pour les changements."
          }
          gh release upload $tag --repo apoumier/ArcHive-updates artifacts/*.msi artifacts/*.msi.sig artifacts/*.exe artifacts/*.exe.sig --clobber

          # Mettre à jour les URLs dans latest.json pour pointer vers ArcHive-updates
          $json = Get-Content artifacts/latest.json -Raw | ConvertFrom-Json
          $json.platforms.PSObject.Properties | ForEach-Object {
            $_.Value.url = $_.Value.url -replace "apoumier/ArcHive/releases/download", "apoumier/ArcHive-updates/releases/download"
          }
          $updated = $json | ConvertTo-Json -Depth 10
          Set-Content -Path artifacts/latest_public.json -Value $updated

          # Pousser latest.json dans le repo ArcHive-updates
          $bytes = [System.IO.File]::ReadAllBytes("artifacts/latest_public.json")
          $base64 = [System.Convert]::ToBase64String($bytes)
          $sha = gh api repos/apoumier/ArcHive-updates/contents/latest.json --jq '.sha' 2>$null
          $body = @{ message = "chore: update latest.json for $tag"; content = $base64 }
          if ($sha) { $body.sha = $sha.Trim() }
          $body | ConvertTo-Json | gh api repos/apoumier/ArcHive-updates/contents/latest.json --method PUT --input -
