<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- favicon web -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ArcHive</title>

    <!-- IMPORTANT : CSS inline (chargé avant tout) pour éviter le flash blanc -->
    <style>
      :root {
        background: #0f141a;
        color: rgba(255, 255, 255, 0.92);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f141a;
      }

      /* Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;

        background:
          radial-gradient(900px 500px at 30% 20%, rgba(255, 255, 255, 0.06), transparent 60%),
          radial-gradient(700px 420px at 80% 60%, rgba(255, 255, 255, 0.04), transparent 55%),
          #0f141a;

        transition:
          opacity 220ms ease,
          transform 220ms ease;
        opacity: 1;
        transform: translateY(0);
      }

      #app-preloader.preloader--done {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }

      .preloader-wrap {
        display: grid;
        gap: 14px;
        justify-items: center;
        text-align: center;
        padding: 20px 18px;
      }

      /* Logo: apparition progressive (fade + scale + blur) */
      .preloader-logo {
        width: 108px;
        height: 108px;
        object-fit: contain;
        display: block;

        opacity: 0;
        transform: scale(0.92) translateY(6px);
        filter: blur(10px);
        animation: logoIn 700ms ease forwards;
      }

      /* Texte: révèle “Arc” puis “Hive” (stagger) */
      .brandLine {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-weight: 900;
        letter-spacing: 0.2px;
        font-size: 26px;
        line-height: 1.05;
        margin-top: 2px;

        display: inline-flex;
        gap: 0px;
        align-items: baseline;
      }

      .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(6px);
        filter: blur(6px);
      }

      .word--arc {
        animation: wordIn 520ms ease forwards;
        animation-delay: 520ms;
      }

      .word--hive {
        animation: wordIn 520ms ease forwards;
        animation-delay: 650ms;
      }

      .sub {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-size: 12px;
        opacity: 0;

        transform: translateY(6px);
        animation: subIn 420ms ease forwards;
        animation-delay: 820ms;
      }

      /* Petite barre de chargement (optionnelle) */
      .bar {
        width: min(260px, 70vw);
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;

        animation: subIn 420ms ease forwards;
        animation-delay: 900ms;
      }
      .bar::before {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        animation: move 1.05s ease-in-out infinite;
      }

      @keyframes logoIn {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }

      @keyframes wordIn {
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes subIn {
        to {
          opacity: 0.75;
          transform: translateY(0);
        }
      }

      @keyframes move {
        0% {
          transform: translateX(-10%);
          opacity: 0.55;
        }
        50% {
          transform: translateX(130%);
          opacity: 0.9;
        }
        100% {
          transform: translateX(-10%);
          opacity: 0.55;
        }
      }

      /* Accessibilité: réduit les animations si demandé */
      @media (prefers-reduced-motion: reduce) {
        .preloader-logo,
        .word,
        .sub,
        .bar,
        .bar::before {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Preloader affiché AVANT React -->
    <div id="app-preloader" aria-label="Loading">
      <div class="preloader-wrap">
        <img
          class="preloader-logo"
          src="/src/assets/favicon_logo.png"
          alt="ArcHive"
          draggable="false"
        />

        <div class="brandLine" aria-label="ArcHive">
          <span class="word word--arc">Arc</span><span class="word word--hive">Hive</span>
        </div>

        <div class="sub">Starting…</div>

        <div class="bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module">
      function startApp() {
        import('/src/main.tsx');
      }

      function waitForPreloaderThenStart() {
        const pre = document.getElementById('app-preloader');
        if (!pre) return startApp();

        const last = pre.querySelector('.word--hive');

        const FALLBACK_MS = 1200;
        const timer = window.setTimeout(() => {
          startApp();
        }, FALLBACK_MS);

        if (!last) {
          return;
        }

        const onEnd = () => {
          window.clearTimeout(timer);
          startApp();
        };

        last.addEventListener('animationend', onEnd, { once: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForPreloaderThenStart, { once: true });
      } else {
        waitForPreloaderThenStart();
      }
    </script>
  </body>
</html>
