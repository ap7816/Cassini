<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- favicon web -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ArcHive</title>

    <!-- IMPORTANT : CSS inline (chargé avant tout) pour éviter le flash blanc -->
    <style>
      :root {
        background: #0f141a;
        color: rgba(255, 255, 255, 0.92);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f141a;
      }

      /* Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;

        background:
          radial-gradient(900px 500px at 30% 20%, rgba(255, 255, 255, 0.06), transparent 60%),
          radial-gradient(700px 420px at 80% 60%, rgba(255, 255, 255, 0.04), transparent 55%),
          #0f141a;

        transition:
          opacity 220ms ease,
          transform 220ms ease;
        opacity: 1;
        transform: translateY(0);
      }

      #app-preloader.preloader--done {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }

      .preloader-wrap {
        display: grid;
        gap: 14px;
        justify-items: center;
        text-align: center;
        padding: 20px 18px;
      }

      .brand {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-weight: 800;
        letter-spacing: 0.2px;
        font-size: 22px;
        line-height: 1.1;
      }
      .sub {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-size: 12px;
        opacity: 0.7;
        margin-top: 2px;
      }

      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(255, 255, 255, 0.85);
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.02);
      }

      .bar {
        width: min(260px, 70vw);
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bar::before {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        animation: move 1.05s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes move {
        0% {
          transform: translateX(-10%);
          opacity: 0.55;
        }
        50% {
          transform: translateX(130%);
          opacity: 0.9;
        }
        100% {
          transform: translateX(-10%);
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <!-- Preloader affiché AVANT React -->
    <div id="app-preloader" aria-label="Loading">
      <div class="preloader-wrap">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <div class="brand">ArcHive</div>
          <div class="sub">Starting…</div>
        </div>
        <div class="bar" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
