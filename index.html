<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- favicon web -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ArcHive</title>

    <!-- IMPORTANT : CSS inline (chargé avant tout) pour éviter le flash blanc -->
    <style>
      :root {
        background: #0f141a;
        color: rgba(255, 255, 255, 0.92);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f141a;
      }

      /* Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;

        background:
          radial-gradient(900px 500px at 30% 20%, rgba(255, 255, 255, 0.06), transparent 60%),
          radial-gradient(700px 420px at 80% 60%, rgba(255, 255, 255, 0.04), transparent 55%),
          #0f141a;

        transition:
          opacity 220ms ease,
          transform 220ms ease;
        opacity: 1;
        transform: translateY(0);
      }

      #app-preloader.preloader--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease !important;
      }

      /* Animation d'entrée de l'application (montée depuis le bas) */
      @keyframes appRiseUp {
        from {
          transform: translateY(100vh);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      #root.app-entering {
        animation: appRiseUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .preloader-wrap {
        display: grid;
        gap: 14px;
        justify-items: center;
        text-align: center;
        padding: 20px 18px;
      }

      /* Logo: apparition progressive (fade + scale + blur) */
      .preloader-logo {
        width: 108px;
        height: 108px;
        object-fit: contain;
        display: block;

        opacity: 0;
        transform: scale(0.92) translateY(6px);
        filter: blur(10px);
        animation: logoIn 700ms ease forwards;
      }

      /* Texte: révèle “Arc” puis “Hive” (stagger) */
      .brandLine {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-weight: 900;
        letter-spacing: 0.2px;
        font-size: 26px;
        line-height: 1.05;
        margin-top: 2px;

        display: inline-flex;
        gap: 0px;
        align-items: baseline;
      }

      .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(6px);
        filter: blur(6px);
      }

      .word--arc {
        animation: wordIn 520ms ease forwards;
        animation-delay: 520ms;
      }

      .word--hive {
        animation: wordIn 520ms ease forwards;
        animation-delay: 650ms;
      }

      .sub {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-size: 12px;
        opacity: 0;
        transform: translateY(6px);
        animation: subIn 420ms ease forwards;
        animation-delay: 820ms;
        transition: opacity 0.38s ease, transform 0.38s ease;
      }

      /* Petite barre de chargement */
      .bar {
        width: min(260px, 70vw);
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        animation: subIn 420ms ease forwards;
        animation-delay: 900ms;
        transition: opacity 0.38s ease, transform 0.38s ease;
      }

      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.65);
        animation: fillProgress 2.2s cubic-bezier(0.4, 0, 0.15, 1) both;
        animation-delay: 900ms;
      }

      /* Classe ajoutée par JS pour faire disparaître la barre et le texte */
      .leaving {
        opacity: 0 !important;
        transform: translateY(10px) !important;
        animation: none !important;
      }

      /* Texte de bienvenue — initialement invisible */
      .welcome {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-size: 20px;
        font-weight: 300;
        letter-spacing: 0.1em;
        opacity: 0;
        transform: translateY(-10px);
        filter: blur(6px);
        transition:
          opacity   0.65s ease,
          transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
          filter    0.65s ease;
      }

      .welcome.entering {
        opacity: 0.92;
        transform: translateY(0);
        filter: blur(0);
      }

      @keyframes logoIn {
        to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      }

      @keyframes wordIn {
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      @keyframes subIn {
        to { opacity: 0.75; transform: translateY(0); }
      }

      @keyframes fillProgress {
        0%   { width: 0%; }
        100% { width: 85%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-logo, .word, .sub, .bar, .bar-fill {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          width: 100% !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Preloader affiché AVANT React -->
    <div id="app-preloader" aria-label="Loading">
      <div class="preloader-wrap">
        <img
          class="preloader-logo"
          src="/src/assets/logo.svg"
          alt="ArcHive"
          draggable="false"
        />

        <div class="brandLine" aria-label="ArcHive">
          <span class="word word--arc">Arc</span><span class="word word--hive">Hive</span>
        </div>

        <div class="sub" id="preloader-sub">Starting…</div>

        <div class="bar" id="preloader-bar" aria-hidden="true">
          <div class="bar-fill"></div>
        </div>

        <div class="welcome" id="preloader-welcome">Bienvenue sur ArcHive</div>
      </div>
    </div>
    <!-- Audio d'ambiance démarré pendant le splash (adopté par ambientPlayer au montage React).
         Sans `src` ni `loop` : la piste est tirée au sort par preloader.ts, et le rebouclage
         empêcherait l'enchaînement vers la piste suivante. -->
    <audio id="preloader-ambient" preload="auto" style="display:none"></audio>

    <div id="root"></div>
    <!-- Script externe et non inline : la CSP (script-src 'self') bloque
         tout script inline, y compris celui qui chargeait le bundle React. -->
    <script type="module" src="/src/preloader.ts"></script>
  </body>
</html>
