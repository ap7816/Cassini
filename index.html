<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- favicon web -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cassini</title>

    <!-- IMPORTANT : CSS inline (chargé avant tout) pour éviter le flash blanc -->
    <style>
      :root {
        background: #0f141a;
        color: rgba(255, 255, 255, 0.92);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f141a;
      }

      /* Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;

        background:
          radial-gradient(900px 500px at 30% 20%, rgba(255, 255, 255, 0.06), transparent 60%),
          radial-gradient(700px 420px at 80% 60%, rgba(255, 255, 255, 0.04), transparent 55%),
          #0f141a;

        transition:
          opacity 220ms ease,
          transform 220ms ease;
        opacity: 1;
        transform: translateY(0);
      }

      #app-preloader.preloader--done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease !important;
      }

      .preloader-wrap {
        display: grid;
        gap: 14px;
        justify-items: center;
        text-align: center;
        padding: 20px 18px;
      }

      /* Logo: apparition progressive (fade + scale + blur) */
      .preloader-logo {
        width: 108px;
        height: 108px;
        object-fit: contain;
        display: block;

        opacity: 0;
        transform: scale(0.96);
        filter: blur(6px);
        /* Court, et sans délai : l'écran disparaît dès que React a peint —
           une révélation étalée sur 700 ms n'aurait pas le temps d'aboutir. */
        animation: logoIn 260ms ease forwards;
      }

      /* Texte: révèle “Arc” puis “Hive” (stagger) */
      .brandLine {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        font-weight: 900;
        letter-spacing: 0.2px;
        font-size: 26px;
        line-height: 1.05;
        margin-top: 2px;

        display: inline-flex;
        gap: 0px;
        align-items: baseline;
      }

      .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(6px);
        filter: blur(6px);
      }

      .word--cas {
        animation: wordIn 260ms ease forwards;
        animation-delay: 60ms;
      }

      .word--sini {
        animation: wordIn 260ms ease forwards;
        animation-delay: 120ms;
      }

      @keyframes logoIn {
        to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      }

      @keyframes wordIn {
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-logo, .word {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Preloader affiché AVANT React -->
    <div id="app-preloader" aria-label="Loading">
      <div class="preloader-wrap">
        <img
          class="preloader-logo"
          src="/src/assets/logo.svg"
          alt="Cassini"
          draggable="false"
        />

        <div class="brandLine" aria-label="Cassini">
          <span class="word word--cas">Cas</span><span class="word word--sini">sini</span>
        </div>
      </div>
    </div>
    <!-- Audio d'ambiance démarré pendant le splash (adopté par ambientPlayer au montage React).
         Sans `src` ni `loop` : la piste est tirée au sort par preloader.ts, et le rebouclage
         empêcherait l'enchaînement vers la piste suivante. -->
    <audio id="preloader-ambient" preload="auto" style="display:none"></audio>

    <div id="root"></div>
    <!-- Script externe et non inline : la CSP (script-src 'self') bloque
         tout script inline, y compris celui qui chargeait le bundle React. -->
    <script type="module" src="/src/preloader.ts"></script>
  </body>
</html>
